<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight B</title>
    <style id="theme-vars">
/* ============================================================
   韩漫阅读器 · 方向 B「暖纸书店」
   暖纸白/米灰底 + 低饱和深绿点缀，文具店/书店的温柔质感
   演示主题：日间（html.light）；同时提供完整夜间色板
   字体层级：苹方系统栈，字号略大、行距宽松，圆角更饱满
   ============================================================ */

:root {
  /* —— 语义别名 · 日间（暖纸） —— */
  --mr-background: #f6f2e8;
  --mr-foreground: #2f2c25;
  --mr-card: #fcfaf3;
  --mr-card-foreground: #2f2c25;
  --mr-popover: #fffdf6;
  --mr-popover-foreground: #2f2c25;
  --mr-primary: #4c5f50;
  --mr-primary-foreground: #f6f4ea;
  --mr-muted: #ebe6d7;
  --mr-muted-foreground: #7b7565;
  --mr-border: rgba(47, 44, 37, 0.12);
  --mr-input: rgba(47, 44, 37, 0.07);
  --mr-ring: #4c5f50;

  /* 圆角层级（比 A 更饱满一档） */
  --mr-radius-sm: 10px;
  --mr-radius-md: 14px;
  --mr-radius-lg: 20px;

  /* —— 扩展令牌 · 日间 —— */
  --mr-ink-3: #a29b89;
  --mr-line: rgba(47, 44, 37, 0.09);
  --mr-line-strong: rgba(47, 44, 37, 0.16);
  --mr-brand-soft: rgba(76, 95, 80, 0.12);
  --mr-brand-soft-2: rgba(76, 95, 80, 0.24);
  --mr-glass: rgba(246, 242, 232, 0.86);
  --mr-scrim: rgba(47, 44, 37, 0.32);
  --mr-stage: #efeadd;
  --mr-page: #e0dac9;
  --mr-page-line: rgba(47, 44, 37, 0.14);
  --mr-track: rgba(47, 44, 37, 0.12);
  --mr-shadow-1: 0 1px 3px rgba(60, 52, 38, 0.05), 0 1px 2px rgba(60, 52, 38, 0.03);
  --mr-shadow-float: 0 18px 50px -18px rgba(60, 52, 38, 0.32);
  --mr-cover-1: #dfe4d6;
  --mr-cover-2: #e9dfc6;
  --mr-cover-3: #e2d5c4;
  --mr-cover-4: #d7ddd0;
  --mr-cover-5: #e6dccf;
  --mr-cover-6: #d9d2bd;
  --mr-cover-7: #dce2d9;
  --mr-cover-8: #e3d8c9;
  --mr-font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
  --mr-font-display: "SF Pro Display", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  --mr-font-cover: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
}

:root.dark {
  /* —— 语义别名 · 夜间（夜读暖灯） —— */
  --mr-background: #22251f;
  --mr-foreground: #eae6d8;
  --mr-card: #2a2e26;
  --mr-card-foreground: #eae6d8;
  --mr-popover: #31352b;
  --mr-popover-foreground: #eae6d8;
  --mr-primary: #9db299;
  --mr-primary-foreground: #1e211c;
  --mr-muted: #32362c;
  --mr-muted-foreground: #a8a493;
  --mr-border: rgba(234, 230, 216, 0.11);
  --mr-input: rgba(234, 230, 216, 0.07);
  --mr-ring: #9db299;

  /* —— 扩展令牌 · 夜间 —— */
  --mr-ink-3: #71705f;
  --mr-line: rgba(234, 230, 216, 0.08);
  --mr-line-strong: rgba(234, 230, 216, 0.15);
  --mr-brand-soft: rgba(157, 178, 153, 0.13);
  --mr-brand-soft-2: rgba(157, 178, 153, 0.26);
  --mr-glass: rgba(34, 37, 31, 0.8);
  --mr-scrim: rgba(12, 13, 10, 0.55);
  --mr-stage: #1c1f18;
  --mr-page: #34382e;
  --mr-page-line: rgba(234, 230, 216, 0.12);
  --mr-track: rgba(234, 230, 216, 0.14);
  --mr-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.05), 0 1px 1px rgba(0, 0, 0, 0.03);
  --mr-shadow-float: 0 20px 56px -18px rgba(0, 0, 0, 0.55);
  --mr-cover-1: #38402f;
  --mr-cover-2: #453d28;
  --mr-cover-3: #43382b;
  --mr-cover-4: #36402f;
  --mr-cover-5: #42392c;
  --mr-cover-6: #403a26;
  --mr-cover-7: #333d30;
  --mr-cover-8: #453a2e;
}

/* —— 基础版式 —— */
.mr-app {
  font-family: var(--mr-font-body);
  letter-spacing: 0.012em;
  font-variant-numeric: tabular-nums;
}
.mr-app h1, .mr-app h2, .mr-app h3 {
  font-family: var(--mr-font-display);
  text-wrap: balance;
  word-break: keep-all;
}
.mr-hairline { border-color: var(--mr-line); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--mr-background);
    --color-foreground: var(--mr-foreground);
    --color-card: var(--mr-card);
    --color-card-foreground: var(--mr-card-foreground);
    --color-popover: var(--mr-popover);
    --color-popover-foreground: var(--mr-popover-foreground);
    --color-primary: var(--mr-primary);
    --color-primary-foreground: var(--mr-primary-foreground);
    --color-muted: var(--mr-muted);
    --color-muted-foreground: var(--mr-muted-foreground);
    --color-border: var(--mr-border);
    --color-input: var(--mr-input);
    --color-ring: var(--mr-ring);
    --radius-sm: var(--mr-radius-sm);
    --radius-md: var(--mr-radius-md);
    --radius-lg: var(--mr-radius-lg);
  }
  @layer base {
    body { background: var(--mr-background); color: var(--mr-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }

      .text-card-foreground { color: var(--mr-card-foreground); }
      .border-card-foreground { border-color: var(--mr-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--mr-card-foreground); }
      .bg-popover { background-color: var(--mr-popover); }

      .ring-popover-foreground { --tw-ring-color: var(--mr-popover-foreground); }
      .bg-primary { background-color: var(--mr-primary); }
      .text-primary { color: var(--mr-primary); }
      .border-primary { border-color: var(--mr-primary); }
      .ring-primary { --tw-ring-color: var(--mr-primary); }
      .bg-primary-foreground { background-color: var(--mr-primary-foreground); }
      .text-primary-foreground { color: var(--mr-primary-foreground); }
      .border-primary-foreground { border-color: var(--mr-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--mr-primary-foreground); }
      .bg-muted { background-color: var(--mr-muted); }
      .text-muted { color: var(--mr-muted); }
      .border-muted { border-color: var(--mr-muted); }
      .ring-muted { --tw-ring-color: var(--mr-muted); }
      .bg-muted-foreground { background-color: var(--mr-muted-foreground); }
      .text-muted-foreground { color: var(--mr-muted-foreground); }
      .border-muted-foreground { border-color: var(--mr-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--mr-muted-foreground); }
      .bg-border { background-color: var(--mr-border); }
      .text-border { color: var(--mr-border); }
      .border-border { border-color: var(--mr-border); }

      .bg-input { background-color: var(--mr-input); }

    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        display: inline-flex;

        mask-repeat: no-repeat;

        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
